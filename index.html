        :root {
            --red-bright: #FF2A2A;
            --red-glow: rgba(255, 42, 42, 0.4);
            --border-red: #801818;
            --bg-dark: #08090b;
            --card-bg: rgba(12, 14, 18, 0.88);
            --text-white: #FFFFFF;
            --text-muted: #A0A5AD;
            --font-heading: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
            --font-motto: 'Playfair Display', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: var(--font-body);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Background Gameplay Image (Matches Screenshot) */
        .bg-gameplay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(to bottom, rgba(5,6,8,0.7), rgba(5,6,8,0.95)),
                url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?q=80&w=2000&auto=format&fit=crop'); /* Replace with your own Roblox screenshot URL if desired */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            opacity: 0.25;
            z-index: 0;
            pointer-events: none;
        }

        /* Top Navbar */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 55px;
            background: rgba(0, 0, 0, 0.95);
            border-bottom: 1px solid var(--border-red);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1.5rem;
            z-index: 1000;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 1.1rem;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .brand-logo {
            height: 28px;
            width: auto;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--red-bright);
        }

        /* Hero Section */
        .hero-container {
            position: relative;
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .insignia-backdrop {
            position: absolute;
            width: 100%;
            max-width: 1200px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 1;
        }

        .center-emblem {
            height: 60vh;
            max-height: 500px;
            opacity: 0.35;
            filter: grayscale(100%) contrast(120%) brightness(80%);
        }

        .side-patch {
            position: absolute;
            height: 32vh;
            max-height: 260px;
            opacity: 0.18;
            filter: grayscale(100%) brightness(70%);
        }

        .left-patch { left: 5%; }
        .right-patch { right: 5%; }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 15px;
            margin-top: 20px;
        }

        .hero-title {
            font-family: var(--font-heading);
            font-size: 3rem;
            font-weight: 900;
            color: var(--red-bright);
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 12px var(--red-glow), 2px 2px 4px rgba(0, 0, 0, 0.9);
            line-height: 1.15;
            max-width: 900px;
        }
